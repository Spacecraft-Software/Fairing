[workspace]
resolver = "3"
members = [
  "crates/fairing",
  "crates/fairing-render",
  "crates/fairing-theme",
  "crates/fairing-askpass",
  "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "GPL-3.0-or-later"
authors = ["Mohamed Hammad <Mohamed.Hammad@SpacecraftSoftware.org>"]
homepage = "https://Fairing.SpacecraftSoftware.org/"
repository = "https://github.com/Spacecraft-Software/Fairing"
# Steelbore Standard §6.4: crates.io is an outbound target; publishing is a
# per-release maintainer decision, never an accident of `cargo publish`.
publish = false

# Every dependency is qualified in DEPENDENCIES.md (§24.1) before it is added here.
[workspace.dependencies]
clap = { version = "4.6", features = ["derive", "wrap_help"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
regex = "1.13"
jiff = { version = "0.2", default-features = false, features = ["std"] }
assert_cmd = "2.2"
predicates = "3.1"
tempfile = "3.27"

[workspace.lints.rust]
# Decision 11 / FRN-SRS-100: unsafe lives only in qualified dependencies.
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"
unused_lifetimes = "warn"
ambiguous_negative_literals = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
# The `cargo` group is deliberately off: `cargo_common_metadata` demands
# readme/keywords/categories on unpublished crates and
# `multiple_crate_versions` fires on transitive duplicates we do not control.
allow_attributes_without_reason = "warn"
undocumented_unsafe_blocks = "warn"
unwrap_used = "warn"
expect_used = "warn"
map_err_ignore = "warn"
unused_result_ok = "warn"
if_then_some_else_none = "warn"
semicolon_outside_block = "warn"
literal_string_with_formatting_args = "allow"
# CLI flag sets and environment snapshots are naturally many independent booleans.
struct_excessive_bools = "allow"

# Steelbore Standard §3.2 flag register for release builds.
#   applied:     lto = "fat", codegen-units = 1, panic = "abort", strip = "symbols"
#   not applied: -C target-cpu=native — the binary ships inside the Bravais
#                initrd and must run on any x86-64 (P1 Stability outranks P2).
#   not applied: PGO — deferred until §22 budgets are measured at G2.
#   note:        Rust LTO is LLVM-internal; §3.2.1's GCC plugin caveat does not
#                apply. Re-verify when the Nix build lands.
#   note:        panic = "abort" skips `Drop`, so fairing-askpass zeroises
#                secrets eagerly rather than relying on drop glue (M3 design input).
[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
