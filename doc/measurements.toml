#
# Measured figures for doc/budgets.toml (Steelbore Standard §22.4). Append an
# entry per measurement, never rewrite one: the last entry for a budget is its
# current figure, and the ones before it are its history. Report the median
# and, where more than one run was taken, the spread. CI figures are taken on
# every build and passed to `cargo xtask budgets --measured`; the entries
# here record them at a release.

