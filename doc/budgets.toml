#
# Fairing's resource budgets (Steelbore Standard §22). Each ceiling is stated
# by a requirement in doc/requirements.toml and declared here once, with where
# and how it is measured. Figures live in doc/measurements.toml; `cargo xtask
# budgets` reports the margins and fails a red or exceeded one, and `cargo
# xtask budgets-texi` writes the table the manual includes.
#
# A ceiling may be re-baselined only under §22.2: a dated entry in the
# CHANGELOG with the old ceiling, the new one and what justified it.

[meta]
reference_machine = "The maintainer's ThinkPad T490s: Intel i915 graphics, NVMe storage, a 1920x1080 panel, running Steelbore OS Bravais with a LUKS root."
reference_workload = "A cold boot from power-on to greetd with the reference theme (themes/steelbore.ncl) and a 24-frame animation, as the requirement set defines it."

[[budget]]
id = "initrd-binary"
requirement = "FRN-SRS-105"
resource = "binary size"
ceiling = 2621440
unit = "bytes"
measured = "ci"
method = "The binary the initrd carries: `bin/fairing` of the flake's `fairing-initrd` package, built by nixpkgs without default features as the NixOS module builds it (decided at G1, 2026-10-16); CI's `nix` job. A cargo build of the same features comes out smaller and is reported by the size job only."

[[budget]]
id = "theme-artefact"
requirement = "FRN-SRS-047"
resource = "artefact size"
ceiling = 4194304
unit = "bytes"
measured = "ci"
method = "The reference theme compiled with `fairing theme compile themes/steelbore.ncl`; CI's size job."

[[budget]]
id = "first-frame"
requirement = "FRN-SRS-004"
resource = "cold-start latency"
ceiling = 150
unit = "ms"
measured = "reference"
method = "`first_frame_ms` of `fairing preview --backend drm --seconds 5 --json` on a free VT: process start to the first frame on screen. `cargo xtask measure --preview-drm` reads it (RELEASING.md)."

[[budget]]
id = "artefact-load"
requirement = "FRN-SRS-042"
resource = "theme load time"
ceiling = 5
unit = "ms"
measured = "reference"
method = "`load_ms` of `fairing theme compile themes/steelbore.ncl --json`, the median time to decode the reference artefact from its bytes. `cargo xtask measure --theme-compile` reads it."

[[budget]]
id = "sigterm-release"
requirement = "FRN-SRS-033"
resource = "release latency"
ceiling = 100
unit = "ms"
measured = "reference"
method = "`release_ms` of the stage-2 splash report that ended in `handoff`, from the journal of a reference boot: the tick that saw greetd's SIGTERM to the output released. `cargo xtask measure` reads it."

[[budget]]
id = "fbdev-fallback"
requirement = "FRN-SRS-002"
resource = "fallback latency"
ceiling = 200
unit = "ms"
measured = "reference"
method = "`first_frame_ms` of `fairing preview --backend auto --json` with the DRM devices withheld (`/dev/dri` hidden by a mount namespace), so the failed DRM attempt and the fbdev first frame both fall inside it: an upper bound. `cargo xtask measure --preview-fbdev` reads it."

[[budget]]
id = "reacquire"
requirement = "FRN-SRS-006"
resource = "re-acquire latency"
ceiling = 500
unit = "ms"
measured = "reference"
method = "`reacquire_ms` of the splash reports of a reference boot: the longest a lost output (the simpledrm-to-i915 swap) took to present again, from the first frame that found it lost; `OUTPUT_LOST` and `OUTPUT_BACK` in the journal bracket it. `cargo xtask measure` reads it."

[[budget]]
id = "ask-detect"
requirement = "FRN-SRS-020"
resource = "question latency"
ceiling = 50
unit = "ms"
measured = "reference"
method = "`ask_detect_ms` of the initrd splash report of a reference boot with a LUKS root: the `ask.*` file's last write to the agent opening the question, both on `CLOCK_REALTIME`. `cargo xtask measure` reads it."

[[budget]]
id = "grab-release"
requirement = "FRN-SRS-028"
resource = "grab release latency"
ceiling = 50
unit = "ms"
measured = "reference"
method = "`grab_release_ms` of the initrd splash report of a reference boot with a LUKS root: the agent frame that sends the answer and releases the keyboards at its end, an upper bound on reply to release. `cargo xtask measure` reads it."

[[budget]]
id = "overlay-entry"
requirement = "FRN-SRS-062"
resource = "journal overlay latency"
ceiling = 250
unit = "ms"
measured = "reference"
method = "`overlay_entry_ms` of the splash reports of a reference boot with the overlay shown (Escape) while the boot logs: an entry's `__MONOTONIC_TIMESTAMP` to the frame that takes it, entries under a prompt left out. `cargo xtask measure` reads it."
