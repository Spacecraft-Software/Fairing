#
# cargo-fuzz targets for the two parsers that read untrusted bytes
# (FRN-SRS-101): systemd's ask.* files and compiled theme artefacts.
# A workspace of its own, so libfuzzer-sys stays out of the product
# lockfile; run with a nightly toolchain:
#   cargo +nightly fuzz run ask_parse -- -max_total_time=120

[package]
name = "fairing-fuzz"
version = "0.0.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
fairing-askpass = { path = "../crates/fairing-askpass" }
fairing-theme = { path = "../crates/fairing-theme" }

[workspace]
members = ["."]

[[bin]]
name = "ask_parse"
path = "fuzz_targets/ask_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "artefact_decode"
path = "fuzz_targets/artefact_decode.rs"
test = false
doc = false
bench = false
