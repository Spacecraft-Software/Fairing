[package]
name = "fairing-theme"
description = "Fairing theme: Steelbore palette tokens, variant resolution and (from M2) the compiled theme format"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
publish.workspace = true
build = "build.rs"

[lints]
workspace = true

[dependencies]
# Every dependency below is qualified in DEPENDENCIES.md (§24.1).
serde = { workspace = true }
postcard = { workspace = true }

# Build-time only: `theme check` / `theme compile`. Loading a compiled theme
# (the boot path) needs neither; the initrd build leaves the feature off.
serde_json = { workspace = true, optional = true }
png = { workspace = true, optional = true }
nickel-lang-core = { workspace = true, optional = true }

[features]
# Theme compilation: Nickel evaluation against the embedded contract, PNG
# assets, and the compiled artefact.
compile = ["dep:serde_json", "dep:png", "dep:nickel-lang-core"]

[build-dependencies]
# Parses the vendored house palette at build time; nothing of it reaches the binary.
toml = { workspace = true }

[dev-dependencies]
toml = { workspace = true }
tempfile = { workspace = true }
