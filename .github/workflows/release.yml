#
# Release (Steelbore Standard §5.5, §24.3, §25.3). The maintainer signs and
# pushes the tag (RELEASING.md); this workflow proves the tag publishes what
# it records and drafts the release. It rebuilds the source archive and the
# SBOM from the tag, byte for byte, checks them against the checksums the
# three package definitions and the committed manifest carry, regenerates
# the traceability matrix, and attaches all of it to a draft release, which
# the maintainer reviews and publishes. Nothing is published to a registry.

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: rustup toolchain install
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-cyclonedx@0.5.9
      - name: the tag names the workspace version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 --locked \
            | jq -r '.packages[] | select(.name == "fairing") | .version')
          test "v$version" = "$GITHUB_REF_NAME"
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - run: cargo xtask dist --check
      - run: cargo xtask sbom
      - run: cargo xtask manifest --check
      - run: cargo xtask trace
      # A budget never measured on the reference machine blocks the release
      # (§22.3): its figure goes into doc/measurements.toml before the tag.
      - run: cargo xtask budgets --release
      - name: checksums
        run: |
          cp "doc/releases/fairing-$VERSION.manifest.json" target/dist/
          cp target/trace/matrix.json target/trace/matrix.md target/dist/
          cd target/dist
          sha256sum "fairing-$VERSION.tar.gz" "fairing-$VERSION.cdx.json" \
            "fairing-$VERSION.manifest.json" matrix.json matrix.md > SHA256SUMS
          cat SHA256SUMS >> "$GITHUB_STEP_SUMMARY"
      - name: draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
            --title "Fairing $VERSION" \
            --notes "Fairing $VERSION. See CHANGELOG.md and the release manifest." \
            "target/dist/fairing-$VERSION.tar.gz" \
            "target/dist/fairing-$VERSION.cdx.json" \
            "target/dist/fairing-$VERSION.manifest.json" \
            target/dist/matrix.json target/dist/matrix.md target/dist/SHA256SUMS
