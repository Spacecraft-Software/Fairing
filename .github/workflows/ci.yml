#
# Fairing CI (Steelbore Standard §3.1, §4.3, §6.5, §21.3, §24.2; FRN-SRS-103).
# The toolchain comes from rust-toolchain.toml via `rustup toolchain install`,
# so the pin lives in one place. Every job here has a local equivalent in
# AGENTS.md; a command that is red locally is red here.

name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    needs: fmt
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      # The splash builds the NixOS module runs: no Nickel, and in the initrd
      # no D-Bus either.
      - run: cargo clippy -p fairing --all-targets --no-default-features --features dbus --locked -- -D warnings
      - run: cargo clippy -p fairing --all-targets --no-default-features --locked -- -D warnings

  test:
    runs-on: ubuntu-latest
    needs: fmt
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --locked
      - run: cargo test --workspace --locked
      - run: cargo test -p fairing --no-default-features --features dbus --locked
      - run: cargo test -p fairing --no-default-features --locked

  # Line coverage of every product crate is at least 80 % (§21); the files
  # that only run against a device are listed, with reasons, in
  # xtask/src/coverage.rs and nowhere else.
  coverage:
    runs-on: ubuntu-latest
    needs: fmt
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install && rustup component add llvm-tools
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - run: cargo llvm-cov --workspace --exclude xtask --locked --json --summary-only --output-path target/llvm-cov.json
      - run: cargo xtask coverage | tee -a "$GITHUB_STEP_SUMMARY"

  # The release archive (§5.5): `cargo xtask dist` builds it, vendored and
  # reproducible, and writes its checksum into the three package
  # definitions, which the jobs below then build from it, offline.
  dist:
    runs-on: ubuntu-latest
    needs: fmt
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-cyclonedx@0.5.9
      - run: cargo xtask dist
      - name: the same tree archives to the same bytes
        run: cargo xtask dist --check
      # The SBOM is reproducible too, so the manifest committed at a tag can
      # carry its checksum (§24.3).
      - name: the same tree describes itself in the same bytes
        run: |
          cargo xtask sbom
          sha256sum target/dist/*.cdx.json > target/sbom.sum
          cargo xtask sbom
          sha256sum --check target/sbom.sum
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            target/dist/*.tar.gz
            target/dist/*.cdx.json
            packaging/default.nix
            packaging/guix.scm
            packaging/PKGBUILD

  package-nix:
    runs-on: ubuntu-latest
    needs: dist
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
      - uses: cachix/install-nix-action@v31
      # The archive is not published yet: it goes into the store under the
      # fixed-output path the definition's fetchurl names.
      - run: nix-store --add-fixed sha256 target/dist/fairing-*.tar.gz
      - run: |
          nix build -L --impure --expr '
            let pkgs = (builtins.getFlake (toString ./.)).inputs.nixpkgs.legacyPackages.x86_64-linux;
            in pkgs.callPackage ./packaging/default.nix { }'

  package-arch:
    runs-on: ubuntu-latest
    needs: dist
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
      - run: pacman -Syu --noconfirm --needed cargo make texinfo
      # makepkg refuses to run as root; the archive sits beside the PKGBUILD,
      # so nothing is downloaded and its sha256sums entry is checked.
      - run: |
          useradd --create-home builder
          install -d -o builder /home/builder/pkg
          install -o builder packaging/PKGBUILD target/dist/fairing-*.tar.gz /home/builder/pkg/
          cd /home/builder/pkg
          su builder -c 'makepkg --noconfirm'
          pacman -Qip fairing-*.pkg.tar.zst

  package-guix:
    runs-on: ubuntu-latest
    needs: dist
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
      - uses: PromyLOPh/guix-install-action@v1
      # As for Nix: the archive goes into the store under the name and hash
      # the origin names, so the build fetches nothing.
      - run: guix download "file://$PWD/$(ls target/dist/fairing-*.tar.gz)"
      - run: guix build -f packaging/guix.scm

  # The size budgets (§22, doc/budgets.toml): the stripped release binary the
  # initrd carries is at most 2.5 MiB (FRN-SRS-105) and the compiled reference
  # theme at most 4 MiB (FRN-SRS-047); `cargo xtask budgets` fails a red or
  # exceeded margin. The other two builds are measured and reported.
  size:
    runs-on: ubuntu-latest
    needs: fmt
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: measure the three builds
        run: |
          measure() {
            name="$1"; shift
            cargo build --release --locked -p fairing "$@" --target-dir "target/size-$name"
            bytes=$(stat -c %s "target/size-$name/release/fairing")
            echo "| $name | $bytes |" >> "$GITHUB_STEP_SUMMARY"
            echo "$bytes" > "target/size-$name.bytes"
          }
          {
            echo '| Build | Bytes |'
            echo '|---|---|'
          } >> "$GITHUB_STEP_SUMMARY"
          measure initrd --no-default-features
          measure splash --no-default-features --features dbus
          measure full
      - name: compile the reference theme
        run: |
          target/size-full/release/fairing theme compile themes/steelbore.ncl --output target/steelbore.fairing --json > target/theme-compile.json
          stat -c %s target/steelbore.fairing > target/theme-artefact.bytes
      # Verifies: FRN-SRS-105, FRN-SRS-047
      - name: budgets and margins (§22)
        run: |
          measured="initrd-binary=$(cat target/size-initrd.bytes),theme-artefact=$(cat target/theme-artefact.bytes)"
          {
            echo '```'
            cargo xtask budgets --measured "$measured"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cargo xtask budgets --measured "$measured"

  # The NixOS module: evaluation checks everywhere, VM tests on KVM. Inputs come
  # from the committed flake.lock (P-101); a lock that no longer matches flake.nix
  # fails the job instead of being rewritten.
  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: enable KVM for the NixOS VM tests
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            system-features = nixos-test benchmark big-parallel kvm
      - run: nix flake check -L --no-update-lock-file

  # The two parsers of untrusted bytes, under libFuzzer: two minutes a
  # target on a pull request, ten on main and on a release tag. A crash
  # uploads its reproducer. The prebuilt cargo-fuzz is a musl binary and
  # would default to its own target, so the host triple is named.
  # Implements: FRN-SRS-101
  fuzz:
    runs-on: ubuntu-latest
    needs: fmt
    strategy:
      fail-fast: false
      matrix:
        target: [ask_parse, artefact_decode]
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install nightly --profile minimal
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - name: fuzz ${{ matrix.target }}
        env:
          SECONDS_TO_RUN: ${{ github.event_name == 'pull_request' && 120 || 600 }}
        working-directory: fuzz
        run: cargo +nightly fuzz run --target x86_64-unknown-linux-gnu "${{ matrix.target }}" -- -max_total_time="$SECONDS_TO_RUN"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-${{ matrix.target }}
          path: fuzz/artifacts

  # Implements: FRN-SRS-103
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features --locked

  # Implements: FRN-SRS-103
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit

  reuse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: fsfe/reuse-action@v6

  eol:
    runs-on: ubuntu-latest
    needs: fmt
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Steelbore §6.5 text-file gate (index line endings, BOM, final newline)
        run: cargo xtask check-eol

  texinfo:
    runs-on: ubuntu-latest
    needs: fmt
    env:
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: generated Needs and Requirements chapters are current
        run: cargo xtask req-texi --check
      - name: generated budget table is current
        run: cargo xtask budgets-texi --check
      - name: install texinfo
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends texinfo
      - name: makeinfo zero-warning gate
        run: |
          make -C doc check 2> doc/makeinfo-stderr.txt
          if grep -E 'warning|error' doc/makeinfo-stderr.txt; then
            echo "::error::makeinfo reported warnings"; exit 1
          fi
      - run: make -C doc info html text
      - uses: actions/upload-artifact@v4
        with:
          name: manual
          path: doc/build/

  trace:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: traceability matrix and gate (§21.3)
        run: cargo xtask trace
      - name: progress block (§17.1)
        run: |
          {
            echo '```'
            cargo xtask progress --explain
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: traceability-matrix
          path: target/trace/
