#
# Fairing CI (Steelbore Standard §3.1, §4.3, §6.5, §21.3, §24.2; FRN-SRS-103).
# The toolchain comes from rust-toolchain.toml via `rustup toolchain install`,
# so the pin lives in one place. Every job here has a local equivalent in
# AGENTS.md; a command that is red locally is red here.

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    needs: fmt
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      # The splash builds the NixOS module runs: no Nickel, and in the initrd
      # no D-Bus either.
      - run: cargo clippy -p fairing --all-targets --no-default-features --features dbus --locked -- -D warnings
      - run: cargo clippy -p fairing --all-targets --no-default-features --locked -- -D warnings

  test:
    runs-on: ubuntu-latest
    needs: fmt
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --locked
      - run: cargo test --workspace --locked
      - run: cargo test -p fairing --no-default-features --features dbus --locked
      - run: cargo test -p fairing --no-default-features --locked

  # PRD budget: the stripped release binary the initrd carries is at most
  # 2.5 MiB. The other two builds are measured and reported, not gated.
  size:
    runs-on: ubuntu-latest
    needs: fmt
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: measure the three builds
        run: |
          measure() {
            name="$1"; shift
            cargo build --release --locked -p fairing "$@" --target-dir "target/size-$name"
            bytes=$(stat -c %s "target/size-$name/release/fairing")
            echo "| $name | $bytes |" >> "$GITHUB_STEP_SUMMARY"
            echo "$bytes" > "target/size-$name.bytes"
          }
          {
            echo '| Build | Bytes |'
            echo '|---|---|'
          } >> "$GITHUB_STEP_SUMMARY"
          measure initrd --no-default-features
          measure splash --no-default-features --features dbus
          measure full
      - name: the initrd binary is within 2.5 MiB
        run: |
          bytes=$(cat target/size-initrd.bytes)
          limit=2621440
          echo "initrd binary: $bytes of $limit bytes"
          test "$bytes" -le "$limit"

  # The NixOS module: evaluation checks everywhere, VM tests on KVM. Until
  # flake.lock is committed (P-101) the inputs resolve at run time.
  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: enable KVM for the NixOS VM tests
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            system-features = nixos-test benchmark big-parallel kvm
      - run: nix flake check -L --no-write-lock-file

  # Implements: FRN-SRS-103
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features --locked

  # Implements: FRN-SRS-103
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit

  reuse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: fsfe/reuse-action@v6

  eol:
    runs-on: ubuntu-latest
    needs: fmt
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Steelbore §6.5 text-file gate (index line endings, BOM, final newline)
        run: cargo xtask check-eol

  texinfo:
    runs-on: ubuntu-latest
    needs: fmt
    env:
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: generated Needs and Requirements chapters are current
        run: cargo xtask req-texi --check
      - name: install texinfo
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends texinfo
      - name: makeinfo zero-warning gate
        run: |
          make -C doc check 2> doc/makeinfo-stderr.txt
          if grep -E 'warning|error' doc/makeinfo-stderr.txt; then
            echo "::error::makeinfo reported warnings"; exit 1
          fi
      - run: make -C doc info html text
      - uses: actions/upload-artifact@v4
        with:
          name: manual
          path: doc/build/

  trace:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: traceability matrix and gate (§21.3)
        run: cargo xtask trace
      - name: progress block (§17.1)
        run: |
          {
            echo '```'
            cargo xtask progress --explain
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: traceability-matrix
          path: target/trace/
